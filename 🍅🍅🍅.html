<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>¨̮ ᴴᴬᵛᴱ ᴬ ᴳᴼᴼᴰ ᵀᴵᴹᴱ દ ᵕ̈ ૩</title>
<style>
:root{
  --bg:#F4F6F9;
  --card:#FFFFFF;
  --text:#111827;
  --sub:#374151;
  --muted:#6B7280;
  --faint:#9CA3AF;
  --line:#E5E7EB;
  --line-2:#F1F3F6;
  --blue:#2563EB;
  --blue-dark:#1D4ED8;
  --blue-soft:#EFF4FF;
  --green:#059669;
  --green-soft:#ECFDF5;
  --red:#DC2626;
  --red-soft:#FEF2F2;
  --amber:#B45309;
  --amber-soft:#FFFBEB;
  --shadow:0 2px 8px rgba(17,24,39,.05), 0 12px 32px rgba(17,24,39,.06);
  --shadow-sm:0 1px 3px rgba(17,24,39,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.6;
  display:flex;justify-content:center;
  padding:18px 16px 30px;
}
.app{width:100%;max-width:620px;display:flex;flex-direction:column}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
.brand{
  font-size:13.5px;font-weight:650;color:var(--muted);letter-spacing:0;
  flex:1 1 auto;min-width:0;line-height:1.35;
}
.stat{
  font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;
  display:flex;align-items:center;justify-content:flex-end;gap:8px;flex:0 0 auto;
}
.stat b{color:var(--blue);font-weight:650}
.progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.progress-inner{height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .28s ease}

/* ---------- 首页 ---------- */
.hero{
  background:var(--card);border-radius:20px;box-shadow:var(--shadow);
  padding:22px 22px 20px;margin-top:18px;
}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.hero-date{font-size:13px;color:var(--muted)}
.pill{
  font-size:11.5px;color:var(--blue);background:var(--blue-soft);
  padding:3px 9px;border-radius:99px;white-space:nowrap;
}
.hero-mid{display:flex;align-items:flex-end;gap:8px;margin-bottom:12px}
.hero-num{font-size:42px;font-weight:700;line-height:1;color:var(--blue);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero-num span{font-size:16px;font-weight:500;color:var(--faint);margin-left:4px}
.hero-label{font-size:12.5px;color:var(--muted);padding-bottom:4px}
.hero .progress{margin-bottom:16px;height:6px}
.hero-note{font-size:12.5px;color:var(--muted);margin-top:12px;text-align:center}

/* ---------- 按钮 ---------- */
.btn{
  font:inherit;font-size:14px;font-weight:500;
  border:1px solid var(--line);background:#fff;color:var(--text);
  border-radius:11px;padding:11px 16px;cursor:pointer;
  transition:border-color .15s,background .15s,color .15s,transform .06s;
}
.btn:hover:not(:disabled){border-color:#C7D2FE;background:#F8FAFF}
.btn:active:not(:disabled){transform:scale(.995)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--blue-dark);border-color:var(--blue-dark)}
.btn.ghost{color:var(--muted)}
.btn.big{
  width:100%;padding:13px 16px;font-size:15px;font-weight:600;border-radius:12px;
  box-shadow:0 4px 14px rgba(37,99,235,.22);
}
.btn.unlock{
  width:100%;color:var(--blue);border-style:dashed;border-color:#BFD3FE;background:#FBFCFF;
  font-size:13.5px;padding:10px 16px;margin-top:14px;
}
.btn.unlock:hover:not(:disabled){background:var(--blue-soft)}
.btn.sm{font-size:13px;padding:8px 12px;border-radius:9px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{
  position:relative;text-align:left;font:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 15px;cursor:pointer;box-shadow:var(--shadow-sm);
  transition:border-color .15s,background .15s;
  display:flex;flex-direction:column;gap:2px;
}
.tile:hover{border-color:#C7D2FE;background:#FBFDFF}
.tile-k{font-size:14.5px;font-weight:600}
.tile-v{font-size:12px;color:var(--muted)}
.tile .badge{
  position:absolute;top:12px;right:12px;min-width:20px;height:20px;padding:0 6px;
  border-radius:99px;background:var(--red-soft);color:var(--red);
  font-size:11px;font-weight:650;display:flex;align-items:center;justify-content:center;
}
.tile.wide{grid-column:1 / -1;flex-direction:row;align-items:center;justify-content:space-between}

/* ---------- 卡片 / 答题 ---------- */
.card{
  position:relative;
  background:var(--card);border-radius:20px;box-shadow:var(--shadow);
  padding:26px 24px 22px;margin-top:18px;animation:pop .18s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hint{font-size:12px;color:var(--muted);letter-spacing:.04em;text-align:center;margin-bottom:6px}
.word{
  font-size:37px;line-height:1.25;font-weight:650;text-align:center;
  letter-spacing:-.01em;word-break:break-word;margin:4px 0 22px;
}
.word.long{font-size:28px}
.word.xlong{font-size:23px}
.options{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  font:inherit;font-size:15px;color:var(--text);background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:12px 15px;cursor:pointer;
  transition:border-color .15s,background .15s;
}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-soft)}
.opt .key{
  flex:0 0 22px;height:22px;border-radius:6px;background:var(--bg);color:var(--muted);
  font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:600;
}
.opt .txt{flex:1}
.opt .mark{font-size:15px;font-weight:700;opacity:0}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .key{background:#D1FAE5;color:var(--green)}
.opt.right .mark{opacity:1;color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .key{background:#FEE2E2;color:var(--red)}
.opt.wrong .mark{opacity:1;color:var(--red)}
.opt.mute{opacity:.5}

.feedback{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);animation:pop .18s ease}
.fb-line{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:6px}
.fb-ok{color:var(--green)}
.fb-no{color:var(--red)}
.fb-rev{color:var(--muted);font-weight:500}
.fb-word{font-size:12.5px;color:var(--muted)}
.fb-word b{color:var(--text);font-weight:650}
.fb-mean{font-size:16.5px;color:var(--text);margin-top:2px;font-weight:500}
.fb-note{font-size:11.5px;color:var(--faint);margin-top:8px}

.actions{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
.actions .btn{flex:1 1 0;min-width:84px}
.actions .btn.ghost{flex:0 0 auto;min-width:0}

.done{text-align:center;padding:8px 0 2px}
.done h2{font-size:21px;margin-bottom:6px}
.done p{color:var(--muted);font-size:14px}
.done .big{font-size:42px;font-weight:700;color:var(--blue);margin:6px 0 2px;font-variant-numeric:tabular-nums}

/* ---------- 遮罩层 ---------- */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;padding:20px 16px 44px;display:flex;justify-content:center}
.overlay[hidden]{display:none}
.overlay-inner{width:100%;max-width:620px}
.overlay-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:14px;position:sticky;top:-20px;background:var(--bg);
  padding:8px 0 10px;z-index:2;
}
.overlay-title{font-size:16px;font-weight:650}
.overlay-sub{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}

.list{background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:none}
.row .no{flex:0 0 26px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:3px}
.row .en{flex:0 0 40%;font-size:15px;font-weight:600;word-break:break-word}
.row .cn{flex:1;font-size:14px;color:var(--sub);word-break:break-word}
.row.hit{background:var(--amber-soft)}
.row.hit .no{color:var(--amber)}
.row:hover{background:#FAFBFC}

.search{
  width:100%;font:inherit;font-size:14px;padding:10px 14px;border:1px solid var(--line);
  border-radius:11px;background:#fff;margin-bottom:10px;outline:none;
}
.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}

/* ---------- 导入 ---------- */
.drop{
  background:#fff;border:1.5px dashed #C9D5EA;border-radius:16px;
  padding:26px 18px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;
}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop-ico{font-size:26px;margin-bottom:6px}
.drop-t{font-size:14.5px;font-weight:600}
.drop-s{font-size:12px;color:var(--muted);margin-top:3px}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px;margin:16px 0 10px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
textarea{
  width:100%;min-height:104px;font:inherit;font-size:13.5px;line-height:1.7;
  padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;
  resize:vertical;outline:none;color:var(--text);
}
textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.imp-actions{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap}
.imp-actions .btn{flex:1 1 0}

.pv-head{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px;font-size:13.5px;font-weight:600}
.pv-head b{color:var(--blue);font-size:15px}
.pv-tip{font-size:11.5px;font-weight:400;color:var(--faint);margin-left:auto}
.pv-list{background:#fff;border-radius:14px;box-shadow:var(--shadow-sm);overflow:hidden;max-height:46vh;overflow-y:auto}
.pv-row{display:flex;align-items:center;gap:7px;padding:7px 10px;border-bottom:1px solid var(--line-2)}
.pv-row:last-child{border-bottom:none}
.pv-no{flex:0 0 20px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.pv-row input{
  font:inherit;font-size:13px;padding:6px 8px;border:1px solid transparent;border-radius:7px;
  background:#FAFBFC;outline:none;min-width:0;color:var(--text);
}
.pv-row input:focus{border-color:var(--blue);background:#fff}
.pv-row input.w{flex:0 0 37%;font-weight:600}
.pv-row input.m{flex:1}
.pv-del{
  flex:0 0 24px;height:24px;border:none;background:none;color:var(--faint);
  font-size:15px;cursor:pointer;border-radius:6px;line-height:1;
}
.pv-del:hover{background:var(--red-soft);color:var(--red)}

.imp-foot{
  position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 68%,rgba(244,246,249,0));
  padding:14px 0 4px;margin-top:14px;display:flex;gap:9px;
}
.imp-foot .btn{flex:1}

/* ---------- 设置 ---------- */
.panel{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:4px 18px;margin-bottom:14px}
.field{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-bottom:1px solid var(--line-2)}
.field:last-child{border-bottom:none}
.field-label{font-size:14.5px;font-weight:600}
.field-desc{font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
.num-input{
  width:72px;font:inherit;font-size:15px;font-weight:600;text-align:center;
  padding:7px 6px;border:1px solid var(--line);border-radius:9px;outline:none;color:var(--text);
}
.num-input:focus{border-color:var(--blue)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{
  font:inherit;font-size:12.5px;padding:5px 11px;border-radius:99px;
  border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;
}
.chip:hover{border-color:#C7D2FE}
.chip.on{background:var(--blue-soft);border-color:#BFD3FE;color:var(--blue);font-weight:600}
.seg{display:flex;gap:6px}
.seg .btn{font-size:12.5px;padding:6px 12px;border-radius:99px}
.seg .btn.on{background:var(--blue-soft);border-color:#BFD3FE;color:var(--blue);font-weight:600}
.sec-title{font-size:12px;color:var(--faint);letter-spacing:.06em;margin:18px 0 8px;padding-left:2px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(8px);
  background:rgba(17,24,39,.94);color:#fff;font-size:13.5px;
  padding:10px 18px;border-radius:99px;z-index:99;opacity:0;
  transition:opacity .2s,transform .2s;pointer-events:none;max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 收藏星标 ---------- */
.fav-btn{
  position:absolute;top:11px;right:11px;width:34px;height:34px;padding:0;
  border:none;background:none;cursor:pointer;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,transform .1s;
}
.fav-btn:hover{background:var(--blue-soft)}
.fav-btn:active{transform:scale(.88)}
.fav-btn svg{display:block}
.fav-btn.pop{animation:starpop .32s ease}
@keyframes starpop{0%{transform:scale(.8)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
.hint-pad{padding:0 30px}
.fav-del{
  flex:0 0 26px;height:26px;padding:0;border:none;background:none;cursor:pointer;
  border-radius:7px;display:flex;align-items:center;justify-content:center;
}
.fav-del:hover{background:var(--blue-soft)}
.fav-del svg{width:17px;height:17px}
.sp-box.hint{background:var(--amber-soft);border-color:#E9C48A;color:var(--amber)}

/* ---------- 自动下一词开关 ---------- */
.switch{
  width:38px;height:21px;flex:0 0 auto;border:none;border-radius:99px;padding:0;
  background:#C6CDD9;cursor:pointer;position:relative;transition:background .2s;
}
.switch::after{
  content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);
  transition:transform .22s cubic-bezier(.22,1,.36,1);
}
.switch.on{background:var(--blue)}
.switch.on::after{transform:translateX(17px)}
.auto-tip{font-size:11px;color:var(--faint);margin-right:-2px}

/* ---------- 拼写练习 ---------- */
.spell-word{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;
  gap:1px;margin:18px 0 14px;
}
.sp-ch{
  font-size:32px;font-weight:650;line-height:1;color:var(--text);
  height:46px;display:inline-flex;align-items:center;padding-bottom:2px;
}
.sp-box{
  width:32px;height:46px;padding:0;
  font-family:inherit;font-size:32px;font-weight:650;text-align:center;line-height:42px;
  color:var(--blue);background:transparent;outline:none;
  border:none;border-bottom:2.5px solid #C9D2E2;border-radius:5px 5px 0 0;
  transition:border-color .15s,background .15s;
}
.sp-box:focus{border-color:var(--blue);background:var(--blue-soft)}
.sp-box.ok{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.sp-box.bad{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.sp-space{width:22px;height:1px}
.sp-meaning{
  text-align:center;font-size:17px;font-weight:500;color:var(--sub);
  margin-top:2px;line-height:1.6;
}
.sp-tip{text-align:center;font-size:12px;color:var(--faint);margin-top:14px}
.sp-done{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);text-align:center;animation:pop .18s ease}


@media (max-width:420px){
  body{padding:14px 12px 26px}
  .word{font-size:31px}
  .word.long{font-size:24px}
  .word.xlong{font-size:20px}
  .card{padding:22px 17px 18px}
  .hero{padding:19px 18px 17px}
  .hero-num{font-size:37px}
  .row .en{flex:0 0 38%;font-size:14px}
  .row .cn{font-size:13px}
  .actions .btn{min-width:0;padding:10px 12px;font-size:13.5px}
  .brand{font-size:12px}
  .sp-ch{font-size:25px;height:38px}
  .sp-box{width:24px;height:38px;font-size:25px;line-height:34px;border-bottom-width:2px}
  .sp-space{width:13px}
  .sp-meaning{font-size:15.5px}
}
</style>
</head>
<body>
<script>window.__appBooted = false;</script>
<div class="app">
  <div class="topbar">
    <div class="brand">¨̮ ᴴᴬᵛᴱ ᴬ ᴳᴼᴼᴰ ᵀᴵᴹᴱ દ ᵕ̈ ૩</div>
    <div class="stat" id="stat"></div>
  </div>
  <div id="main"></div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="overlay-inner" id="overlayInner"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   1. 种子词库（英A复习）
   ========================================================= */
const SEED = [
  ["axiomatic","不言自明的"],["blurry","模糊的"],["forge","形成，缔造"],["crucible","坩埚，熔炉"],

  ["bystander","旁观者，局外人"],["dilute","降低（浓度），削弱"],["reconcile","使和谐一致"],["luminous","发光的，夜明的"],
  ["crystallise","变得明朗而具体"],["vivify","使生动"],["solitary","单独的，无伴的"],["introspection","内省，反省"],
  ["insomnia","失眠"],["consummate","实现，完成"],["embody","代表，体现（思想或品质）"],["scaffold","支架"],
  ["wipe away","抹去"],["contextual","上下文的，与语境相关的"],["postulate","假设"],["proliferate","激增，扩散"],
  ["conjecture","推测"],["verification","证明"],["mull","反复思考"],["cogent","令人信服的"],["paradigm","示例"],
  ["tribute","致敬"],["admonish","批评，责备"],["tutelage","受指导／监护（期）"],["ingenious","精巧的"],
  ["tacitly","心照不宣地"],["divine","发现，猜出"],["humdrum","单调的，乏味的"],["mundane","平凡的"],
  ["contraption","奇怪的机械装置"],["validate","证实，使生效"],["pluck","揪，扯"],["veracity","真实性，正确性"],
  ["ascendancy","优势，支配（地位）"],["proponent","支持者，拥护者"],["pantheon","万神殿"],["dearth","缺乏"],
  ["verify","核对"],["curvature","弯曲，曲率"],["baton","接力棒"],["edifice","建筑"],
  ["confounding","令人困惑的，惊愕的"],["delicacy","微妙；精美；美味"],["supremacy","主导权"],["practitioner","从业者"],
  ["manipulation","操作"],["ultimate","最高的"],["laureate","得奖人"],["consecutive","相继的"],
  ["underlying","基本的，潜在的"],["elicit","探得，引出"],["faculty","全体教职员工"],["stun","使目瞪口呆"],
  ["glide","悄然滑行"],["aesthetic","美学的"],["compelling","引人注目的"],["fallible","难免有错误的，会犯错的"],
  ["seduce","迷惑，使人迷"],["kitschy","（艺术作品）媚俗的"],["diversity","多样性"],["multidimensional","多维的"],
  ["indivisibility","不可分割性"],["give rise to","引起，导致"]
];

/* =========================================================
   2. 状态与存储
   ========================================================= */
const KEY = "vocab_daily_v1";
const OPT_KEYS = ["A","B","C"];
const $ = id => document.getElementById(id);

let view = "home";          // home | quiz | done
let session = null;         // {mode, ids, pos, cache, right, wrong}
let imp = {rows: [], name: ""};
let listFilter = "";
let storageOK = true;

const uid = () => "w" + Math.random().toString(36).slice(2, 9);
const todayStr = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
};
const fmtCN = ds => {
  const [y, m, d] = ds.split("-");
  const wk = ["日","一","二","三","四","五","六"][new Date(+y, +m - 1, +d).getDay()];
  return +m + "月" + +d + "日 周" + wk;
};

function freshState(){
  return {
    v: 1,
    words: SEED.map(([w, m]) => ({id: uid(), w, m})),
    cursor: 0,
    wrong: [],
    settings: {quota: 20, rollover: true, shuffleOpts: true},
    day: {date: "", queue: [], done: [], pending: [], right: 0, wrong: 0, built: false, newCount: 0},
    hist: {},
    seen: {},
    fav: [],
    seeded: true
  };
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return freshState();
    const s = JSON.parse(raw);
    if(!s || !Array.isArray(s.words)) return freshState();
    s.settings = Object.assign({quota: 20, rollover: true, shuffleOpts: true}, s.settings || {});
    s.day = Object.assign({date: "", queue: [], done: [], pending: [], right: 0, wrong: 0, built: false, newCount: 0}, s.day || {});
    s.hist = s.hist || {};
    s.wrong = s.wrong || [];
    s.seen = s.seen || {};
    s.fav = s.fav || [];
    s.cursor = s.cursor || 0;
    return s;
  }catch(e){ return freshState(); }
}

let st = load();

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(st)); }
  catch(e){
    if(storageOK){
      storageOK = false;
      toast("当前环境无法保存进度（请用 Chrome/Edge 打开）");
    }
  }
}

/* =========================================================
   3. 每日队列
   ========================================================= */
function byId(id){ return st.words.find(x => x.id === id); }

function buildDay(){
  const d = st.day;
  if(d.built) return;
  const q = [];
  (d.pending || []).forEach(id => { if(byId(id) && !q.includes(id)) q.push(id); });
  d.pending = [];
  let added = 0;
  const quota = Math.max(1, st.settings.quota | 0);
  while(q.length < quota && st.cursor < st.words.length){
    const w = st.words[st.cursor++];
    if(!q.includes(w.id)){ q.push(w.id); added++; }
  }
  d.queue = q;
  d.newCount = added;
  d.built = true;
}

function ensureToday(){
  const t = todayStr();
  if(st.day.date === t && st.day.built) return;
  if(st.day.date !== t){
    if(st.day.date){
      st.hist[st.day.date] = {
        done: st.day.done.length,
        total: st.day.queue.length,
        right: st.day.right,
        wrong: st.day.wrong
      };
    }
    const unfinished = st.day.queue.filter(id => !st.day.done.includes(id) && byId(id));
    st.day = {
      date: t, queue: [], done: [], right: 0, wrong: 0, built: false, newCount: 0,
      pending: st.settings.rollover ? unfinished : []
    };
  }
  // 清掉词库里已被删除的 id
  st.day.queue = st.day.queue.filter(id => byId(id));
  st.day.done = st.day.done.filter(id => byId(id));
  buildDay();
  save();
}

function rebuildDay(){
  const d = st.day;
  // 今日尚未答完的词先转为顺延，避免改配额时丢失
  const remain = d.queue.filter(id => !d.done.includes(id) && byId(id));
  if(d.newCount) st.cursor = Math.max(0, st.cursor - d.newCount);
  d.newCount = 0; d.built = false; d.queue = [];
  d.pending = remain;
  buildDay();
  save();
}

/* =========================================================
   4. 工具
   ========================================================= */
function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function sampleN(arr, n){
  const copy = arr.slice();
  const out = [];
  while(out.length < n && copy.length){
    out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
  }
  return out;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
let toastTimer = null;
let autoTimer = null;

function starSVG(on){
  return '<svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">' +
    '<path d="M12 3.1l2.78 5.63 6.22.9-4.5 4.39 1.06 6.2L12 17.3l-5.56 2.92 1.06-6.2-4.5-4.39 6.22-.9z" ' +
    'fill="' + (on ? "#2563EB" : "none") + '" stroke="#2563EB" stroke-width="1.65" stroke-linejoin="round"/></svg>';
}

function isFav(id){ return (st.fav || []).indexOf(id) !== -1; }

function toggleFav(id){
  if(!st.fav) st.fav = [];
  if(isFav(id)) st.fav = st.fav.filter(x => x !== id);
  else st.fav.push(id);
  save();
}
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1900);
}

/* =========================================================
   5. 首页
   ========================================================= */
function renderHome(){
  const d = st.day;
  const total = d.queue.length;
  const done = d.done.length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const remainWords = Math.max(0, st.words.length - st.cursor);
  const pending = d.queue.filter(id => !d.done.includes(id)).length;
  const quota = Math.max(1, st.settings.quota | 0);
  const daysLeft = Math.ceil(remainWords / quota);
  const learned = Object.keys(st.seen || {}).filter(byId).length;
  const cycleDone = st.cursor >= st.words.length && pending === 0 && total === 0;
  const wrongN = st.wrong.filter(byId).length;
  const favN = (st.fav || []).filter(byId).length;
  const spellN = total ? total : st.words.length;

  let mainBtn;
  if(cycleDone){
    mainBtn = '<button class="btn primary big" id="btnStart">🔄 词库已过一轮，重新开始</button>';
  }else if(total === 0){
    mainBtn = '<button class="btn primary big" id="btnStart">今日无新词，导入词库继续</button>';
  }else if(done >= total){
    mainBtn = '<button class="btn primary big" id="btnStart">✅ 今日已完成，再来一遍</button>';
  }else if(done > 0){
    mainBtn = '<button class="btn primary big" id="btnStart">继续今日背诵（还剩 ' + (total - done) + ' 词）</button>';
  }else{
    mainBtn = '<button class="btn primary big" id="btnStart">开始今日背诵</button>';
  }

  let note;
  if(cycleDone){
    note = "共 " + st.words.length + " 词，已全部过完一轮";
  }else if(total === 0){
    note = "词库共 " + st.words.length + " 词";
  }else{
    const carried = Math.max(0, total - (d.newCount || 0));
    note = "今日配额 " + quota + " 词" +
      (carried > 0 ? "（含顺延 " + carried + " 词）" : "") +
      " · 新词还剩 " + remainWords + " 词" + (daysLeft > 0 ? "（约 " + daysLeft + " 天）" : "");
  }

  $("main").innerHTML =
    '<section class="hero">' +
      '<div class="hero-top">' +
        '<span class="hero-date">' + fmtCN(d.date || todayStr()) + '</span>' +
        '<span class="pill">词库 ' + st.words.length + ' 词</span>' +
      '</div>' +
      '<div class="hero-mid">' +
        '<div class="hero-num"><b>' + done + '</b><span>/ ' + total + '</span></div>' +
        '<div class="hero-label">今日已背</div>' +
      '</div>' +
      '<div class="progress"><div class="progress-inner" style="width:' + pct + '%"></div></div>' +
      '<div style="margin-top:16px">' + mainBtn + '</div>' +
      '<div class="hero-note">' + note + '</div>' +
    '</section>' +
    '<div class="tiles">' +
      '<button class="tile" id="btnReview"><span class="tile-k">错词复习</span><span class="tile-v">' +
        (wrongN ? "待巩固 " + wrongN + " 词" : "暂无错词") + '</span>' +
        (wrongN ? '<span class="badge">' + wrongN + '</span>' : '') +
      '</button>' +
      '<button class="tile" id="btnList"><span class="tile-k">全部词表</span><span class="tile-v">看释义 / 搜索</span></button>' +
      '<button class="tile" id="btnImport"><span class="tile-k">导入词库</span><span class="tile-v">Word / txt / 粘贴</span></button>' +
      '<button class="tile" id="btnSettings"><span class="tile-k">设置</span><span class="tile-v">每日 ' + quota + ' 词</span></button>' +
      '<button class="tile" id="btnFav"><span class="tile-k">收藏词汇</span><span class="tile-v">' +
        (favN ? "已收藏 " + favN + " 词" : "答题时点五角星收藏") + '</span>' +
        (favN ? '<span class="badge" style="background:var(--blue-soft);color:var(--blue)">' + favN + '</span>' : '') +
      '</button>' +
      '<button class="tile" id="btnSpell"><span class="tile-k">拼写词汇</span><span class="tile-v">' +
        (total ? "今日 " + spellN + " 词" : "全库 " + spellN + " 词") + ' · 补全字母</span></button>' +
    '</div>';

  $("stat").innerHTML = '已学 <b>' + learned + '</b> / ' + st.words.length;

  $("btnStart").addEventListener("click", () => {
    if(cycleDone){
      st.cursor = 0; st.day.built = false; st.day.queue = []; st.day.done = [];
      st.day.right = 0; st.day.wrong = 0; st.day.newCount = 0;
      buildDay(); save();
      toast("已重新开始第 2 轮");
      return renderHome();
    }
    if(total === 0){ openImport(); return; }
    startSession("today", d.queue.slice());
  });
  $("btnReview").addEventListener("click", () => {
    const ids = st.wrong.filter(byId);
    if(!ids.length){ toast("还没有错词，先背几个吧"); return; }
    startSession("review", shuffle(ids.slice()));
  });
  $("btnList").addEventListener("click", () => openList());
  $("btnImport").addEventListener("click", openImport);
  $("btnSettings").addEventListener("click", openSettings);
  $("btnFav").addEventListener("click", openFav);
  $("btnSpell").addEventListener("click", startSpell);
}

/* =========================================================
   6. 答题
   ========================================================= */
function makeOptions(item){
  const others = st.words.filter(x => x.id !== item.id && x.m !== item.m);
  const picks = sampleN(others, 2).map(x => x.m);
  const arr = [{t: item.m, ok: true}].concat(picks.map(t => ({t, ok: false})));
  return st.settings.shuffleOpts ? shuffle(arr) : arr;
}

function startSession(mode, ids){
  clearTimeout(autoTimer);
  session = {mode, ids, pos: 0, cache: {}, right: 0, wrong: 0, auto: false};
  view = "quiz";
  render();
  window.scrollTo({top: 0});
}

function renderQuiz(){
  const id = session.ids[session.pos];
  const item = byId(id);
  if(!item){ nextCard(); return; }

  let c = session.cache[session.pos];
  if(!c || c.id !== id){
    const opts = makeOptions(item);
    c = session.cache[session.pos] = {id, opts, correct: opts.findIndex(o => o.ok), chosen: -1, revealed: false};
  }
  const answered = c.chosen !== -1 || c.revealed;
  const total = session.ids.length;
  const n = session.pos + 1;

  const modeLabel = session.mode === "review" ? "错词复习" : session.mode === "free" ? "自由练习" : "今日任务";

  let optHTML = "";
  c.opts.forEach((o, i) => {
    let cls = "opt";
    let mark = "";
    if(answered){
      if(o.ok){ cls += " right"; mark = "✓"; }
      else if(i === c.chosen){ cls += " wrong"; mark = "✗"; }
      else { cls += " mute"; }
    }
    optHTML += '<button class="' + cls + '" data-i="' + i + '"' + (answered ? " disabled" : "") + '>' +
                 '<span class="key">' + OPT_KEYS[i] + '</span>' +
                 '<span class="txt">' + esc(o.t) + '</span>' +
                 '<span class="mark">' + mark + '</span>' +
               '</button>';
  });

  let fb = "";
  if(answered){
    const ok = !c.revealed && c.opts[c.chosen] && c.opts[c.chosen].ok;
    const line = c.revealed
      ? '<div class="fb-line fb-rev">已显示答案</div>'
      : (ok ? '<div class="fb-line fb-ok">✓ 答对了</div>'
            : '<div class="fb-line fb-no">✗ 答错了，正确答案在绿色选项</div>');
    fb = '<div class="feedback">' + line +
           '<div class="fb-word"><b>' + esc(item.w) + '</b> · 释义</div>' +
           '<div class="fb-mean">' + esc(item.m) + '</div>' +
         '</div>';
  }

  const isLast = session.pos >= total - 1;
  const wordCls = item.w.length > 16 ? "word xlong" : item.w.length > 11 ? "word long" : "word";

  $("main").innerHTML =
    '<section class="card">' +
      '<button class="fav-btn" id="btnFav" aria-pressed="' + isFav(item.id) + '" title="收藏这个单词">' +
        starSVG(isFav(item.id)) +
      '</button>' +
      '<div class="hint hint-pad">' + modeLabel + ' · ' + n + ' / ' + total + ' · 选出这个词的中文意思</div>' +
      '<div class="' + wordCls + '">' + esc(item.w) + '</div>' +
      '<div class="options" id="options">' + optHTML + '</div>' +
      fb +
      '<button class="btn unlock" id="btnUnlock">🔓 一键解锁全部单词意思</button>' +
    '</section>' +
    '<div class="actions">' +
      '<button class="btn ghost" id="btnPrev"' + (session.pos === 0 ? " disabled" : "") + '>上一词</button>' +
      '<button class="btn" id="btnSkip"' + (answered ? " disabled" : "") + '>显示答案</button>' +
      '<button class="btn primary" id="btnNext">' + (isLast ? "完成" : "下一词") + '</button>' +
      '<button class="btn ghost" id="btnQuit">退出</button>' +
    '</div>';

  $("stat").innerHTML = '答对 <b>' + session.right + '</b> · 答错 ' + session.wrong +
    '<span class="auto-tip">自动</span>' +
    '<button class="switch' + (session.auto ? " on" : "") + '" id="btnAuto" title="答对后自动跳到下一词" aria-label="答对后自动跳到下一词"></button>';

  $("btnAuto").addEventListener("click", () => {
    session.auto = !session.auto;
    const b = $("btnAuto");
    b.classList.toggle("on", session.auto);
    if(session.auto) toast("已开启自动下一词，从当前词开始生效");
    else toast("已关闭自动下一词");
  });

  $("btnFav").addEventListener("click", e => {
    const btn = e.currentTarget;
    toggleFav(item.id);
    const on = isFav(item.id);
    btn.innerHTML = starSVG(on);
    btn.setAttribute("aria-pressed", on);
    btn.classList.remove("pop");
    if(on){ void btn.offsetWidth; btn.classList.add("pop"); }
  });

  $("options").addEventListener("click", e => {
    const b = e.target.closest(".opt");
    if(!b || b.disabled) return;
    answer(Number(b.dataset.i));
  });
  $("btnSkip").addEventListener("click", () => reveal());
  $("btnNext").addEventListener("click", nextCard);
  $("btnPrev").addEventListener("click", prevCard);
  $("btnQuit").addEventListener("click", () => { clearTimeout(autoTimer); view = "home"; session = null; render(); });
  $("btnUnlock").addEventListener("click", () => openList(true));
}

function answer(i){
  const c = session.cache[session.pos];
  if(!c || c.chosen !== -1 || c.revealed) return;
  c.chosen = i;
  const ok = !!c.opts[i].ok;
  const item = byId(c.id);
  if(!item) return;
  st.seen[item.id] = 1;

  if(ok) session.right++; else session.wrong++;

  if(session.mode === "today"){
    if(!st.day.done.includes(item.id)) st.day.done.push(item.id);
    if(ok) st.day.right++; else st.day.wrong++;
  }
  if(ok){
    if(session.mode === "review"){
      st.wrong = st.wrong.filter(x => x !== item.id);
    }
  }else{
    if(!st.wrong.includes(item.id)) st.wrong.push(item.id);
  }
  if(session.mode === "today" && st.day.done.length > st.day.queue.length){
    // 理论上不会发生，兜底
    st.day.done = st.day.done.slice(0, st.day.queue.length);
  }
  save();
  render();

  // 答对后自动跳转（开关在此词上生效）
  if(ok && session.auto){
    const pos = session.pos;
    clearTimeout(autoTimer);
    autoTimer = setTimeout(() => {
      if(view !== "quiz" || !session || session.pos !== pos) return;
      nextCard();
    }, 720);
  }
}

function reveal(){
  const c = session.cache[session.pos];
  if(!c || c.chosen !== -1 || c.revealed) return;
  c.revealed = true;
  const item = byId(c.id);
  if(item) st.seen[item.id] = 1;
  if(session.mode === "today" && item && !st.day.done.includes(item.id)){
    st.day.done.push(item.id);
    st.day.wrong++;
  }
  if(item && !st.wrong.includes(item.id)) st.wrong.push(item.id);
  save();
  render();
}

function nextCard(){
  clearTimeout(autoTimer);
  const c = session.cache[session.pos];
  if(c && c.chosen === -1 && !c.revealed){ reveal(); return; }
  if(session.pos < session.ids.length - 1){ session.pos++; render(); window.scrollTo({top: 0}); }
  else finishSession();
}

function prevCard(){
  clearTimeout(autoTimer);
  if(session.pos > 0){ session.pos--; render(); window.scrollTo({top: 0}); }
}

function finishSession(){
  view = "done";
  render();
}

/* =========================================================
   7. 完成页
   ========================================================= */
function renderDone(){
  const right = session.right, wrong = session.wrong;
  const total = right + wrong;
  const acc = total ? Math.round(right / total * 100) : 0;
  const isToday = session.mode === "today";
  const modeText = session.mode === "spell" ? "拼写练习完成"
                 : session.mode === "review" ? "错词复习完成"
                 : "今日任务完成";
  const wrongN = st.wrong.filter(byId).length;
  const nextQuota = Math.min(st.settings.quota, Math.max(0, st.words.length - st.cursor));

  $("main").innerHTML =
    '<section class="card">' +
      '<div class="done">' +
        '<div class="big">' + right + ' / ' + total + '</div>' +
        '<p>正确率 ' + acc + '%　·　' + modeText + '</p>' +
        '<h2 style="margin-top:18px;font-size:17px">' +
          (acc >= 90 ? "记得很牢 👏" : acc >= 70 ? "不错，再巩固一下错词" : "错词有点多，建议复习一遍") +
        '</h2>' +
      '</div>' +
      '<div class="actions" style="margin-top:20px">' +
        '<button class="btn primary" id="btnAgain">再来一轮</button>' +
        '<button class="btn" id="btnWrongReview"' + (wrongN ? "" : " disabled") + '>复习错词' + (wrongN ? "(" + wrongN + ")" : "") + '</button>' +
      '</div>' +
      '<div class="actions">' +
        '<button class="btn ghost" id="btnBackHome" style="flex:1">回到首页</button>' +
      '</div>' +
      (isToday && nextQuota > 0
        ? '<div class="hero-note" style="margin-top:14px">明天将开始新的一批 ' + nextQuota + ' 个词</div>'
        : '') +
    '</section>';

  $("stat").innerHTML = '本轮 <b>' + right + '</b> / ' + total;
  $("btnAgain").addEventListener("click", () => {
    if(session.mode === "spell"){
      session = {mode: "spell", ids: shuffle(session.ids.slice()), pos: 0, cache: {}, right: 0, wrong: 0, auto: false};
      view = "spell"; render(); window.scrollTo({top: 0}); return;
    }
    const ids = session.ids.slice();
    startSession(session.mode, session.mode === "review" ? ids : shuffle(ids));
  });
  $("btnWrongReview").addEventListener("click", () => {
    const ids = st.wrong.filter(byId);
    if(!ids.length){ toast("暂无错词"); return; }
    startSession("review", shuffle(ids));
  });
  $("btnBackHome").addEventListener("click", () => { session = null; view = "home"; render(); });
}

/* =========================================================
   8. 拼写练习
   ========================================================= */
function spellMask(item){
  const chars = Array.from(item.w);
  const idx = [];
  chars.forEach((c, i) => { if(/[A-Za-z]/.test(c)) idx.push(i); });
  const n = idx.length;
  const m = chars.map(() => false);
  if(!n) return m;
  let hide = Math.max(1, Math.round(n * 0.4));
  hide = Math.min(hide, Math.max(1, n - 1));
  sampleN(idx, hide).forEach(i => { m[i] = true; });
  return m;
}

function startSpell(){
  let ids = st.day.queue.filter(byId);
  if(!ids.length) ids = st.words.map(w => w.id);
  if(!ids.length){ toast("词库是空的，先导入词库"); return; }
  clearTimeout(autoTimer);
  session = {mode: "spell", ids: shuffle(ids.slice()), pos: 0, cache: {}, right: 0, wrong: 0, auto: false};
  view = "spell";
  render();
  window.scrollTo({top: 0});
}

function renderSpell(){
  const id = session.ids[session.pos];
  const item = byId(id);
  if(!item){ if(session.pos < session.ids.length - 1){ session.pos++; render(); } else finishSession(); return; }

  let c = session.cache[session.pos];
  if(!c || c.id !== id){
    c = session.cache[session.pos] = {id, mask: spellMask(item), checked: false, ok: false, vals: {}};
  }

  const chars = Array.from(item.w);
  let body = "";
  chars.forEach((ch, i) => {
    if(ch === " "){ body += '<span class="sp-space"></span>'; return; }
    if(!/[A-Za-z]/.test(ch)){ body += '<span class="sp-ch">' + esc(ch) + '</span>'; return; }
    if(!c.mask[i]){ body += '<span class="sp-ch">' + esc(ch) + '</span>'; return; }
    const v = c.vals[i] || "";
    let cls = "sp-box";
    let show = v;
    if(c.checked){
      const bad = v.toLowerCase() !== ch.toLowerCase();
      cls += bad ? " bad" : " ok";
      show = v || ch;
    }
    body += '<input class="' + cls + '" data-i="' + i + '" maxlength="1" inputmode="text" autocomplete="off"' +
            ' autocapitalize="off" autocorrect="off" spellcheck="false" value="' + esc(show) + '"' +
            (c.checked ? ' disabled' : '') + '>';
  });

  const total = session.ids.length;
  const n = session.pos + 1;
  const isLast = session.pos >= total - 1;

  let bottom;
  if(c.checked){
    bottom = '<div class="sp-done">' +
        '<div class="fb-line ' + (c.ok ? "fb-ok" : "fb-no") + '" style="justify-content:center;margin-bottom:0">' +
          (c.ok ? "✓ 拼写正确" : '✗ 正确拼写：<span style="margin-left:4px;font-weight:700">' + esc(item.w) + '</span>') +
        '</div>' +
      '</div>';
  }else{
    bottom = '<div class="sp-tip">看释义，只填横线上的字母</div>';
  }

  $("main").innerHTML =
    '<section class="card">' +
      '<button class="fav-btn" id="btnFavSpell" aria-pressed="' + isFav(item.id) + '" title="收藏这个单词">' +
        starSVG(isFav(item.id)) +
      '</button>' +
      '<div class="hint hint-pad">拼写练习 · ' + n + ' / ' + total + '</div>' +
      '<div class="spell-word">' + body + '</div>' +
      '<div class="sp-meaning">' + esc(item.m) + '</div>' +
      bottom +
    '</section>' +
    '<div class="actions">' +
      (c.checked
        ? '<button class="btn primary" id="btnSpNext">' + (isLast ? "完成" : "下一词") + '</button>'
        : '<button class="btn primary" id="btnSpCheck">检查</button>') +
      (c.checked ? '' : '<button class="btn" id="btnSpHint">提示</button>') +
      '<button class="btn ghost" id="btnSpQuit">退出</button>' +
    '</div>';

  $("stat").innerHTML = '拼对 <b>' + session.right + '</b> · 拼错 ' + session.wrong;

  $("btnFavSpell").addEventListener("click", e => {
    const btn = e.currentTarget;
    toggleFav(item.id);
    const on = isFav(item.id);
    btn.innerHTML = starSVG(on);
    btn.setAttribute("aria-pressed", on);
    btn.classList.remove("pop"); void btn.offsetWidth; btn.classList.add("pop");
  });
  $("btnSpQuit").addEventListener("click", () => { view = "home"; session = null; render(); });
  if(c.checked){
    $("btnSpNext").addEventListener("click", nextSpell);
  }else{
    $("btnSpCheck").addEventListener("click", checkSpell);
    $("btnSpHint").addEventListener("click", () => {
      const boxes = Array.prototype.slice.call(document.querySelectorAll(".sp-box"));
      const t = boxes.filter(b => !b.value.trim())[0];
      if(!t){ toast("横线都填上了，点检查试试"); return; }
      t.value = chars[Number(t.dataset.i)];
      t.classList.add("hint");
      const k = boxes.indexOf(t);
      if(boxes[k + 1]) boxes[k + 1].focus();
    });

    const boxes = Array.prototype.slice.call(document.querySelectorAll(".sp-box"));
    boxes.forEach(b => {
      b.addEventListener("input", ev => {
        const v = ev.target.value.replace(/[^A-Za-z]/g, "");
        ev.target.value = v.slice(-1);
        const k = boxes.indexOf(ev.target);
        if(ev.target.value && boxes[k + 1]) boxes[k + 1].focus();
        if(boxes.every(x => x.value.trim())) checkSpell();
      });
      b.addEventListener("keydown", ev => {
        if(ev.key === "Enter"){ ev.preventDefault(); checkSpell(); }
        if(ev.key === "Backspace" && !ev.target.value){
          const k = boxes.indexOf(ev.target);
          if(k > 0){ ev.preventDefault(); boxes[k - 1].value = ""; boxes[k - 1].focus(); }
        }
      });
    });
    if(boxes[0]) setTimeout(() => boxes[0].focus(), 40);
  }
}

function checkSpell(){
  const c = session.cache[session.pos];
  if(!c || c.checked) return;
  const item = byId(c.id);
  if(!item) return;
  const chars = Array.from(item.w);
  const boxes = Array.prototype.slice.call(document.querySelectorAll(".sp-box"));
  let all = true;
  boxes.forEach(b => {
    const i = Number(b.dataset.i);
    const v = (b.value || "").trim();
    c.vals[i] = v;
    if(v.toLowerCase() !== chars[i].toLowerCase()) all = false;
  });
  c.checked = true;
  c.ok = all;
  st.seen[item.id] = 1;
  if(all){
    session.right++;
    st.wrong = st.wrong.filter(x => x !== item.id);
  }else{
    session.wrong++;
    if(st.wrong.indexOf(item.id) === -1) st.wrong.push(item.id);
  }
  save();
  render();
}

function nextSpell(){
  if(session.pos < session.ids.length - 1){ session.pos++; render(); window.scrollTo({top: 0}); }
  else finishSession();
}

/* =========================================================
   9. 导入（docx / txt / csv / 粘贴）
   ========================================================= */
const W_NS = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
const CJK = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/;

function parseLine(raw){
  let s = String(raw).replace(/\u00a0/g, " ").replace(/[ \t]+$/, "").trim();
  if(!s) return null;

  if(s.includes("\t")){
    const p = s.split(/\t+/).map(x => x.trim()).filter(Boolean);
    if(p.length >= 3 && /^\d{1,3}[.)、]?$/.test(p[0])) p.shift();
    if(p.length >= 2) return makePair(p[0], p.slice(1).join(" "));
    if(p.length === 1) s = p[0];
    else return null;
  }

  s = s.replace(/^[（(]?\d{1,3}[.)、）:：]\s*/, "").replace(/^[-•·*]\s+/, "").trim();
  if(!s) return null;

  const idx = s.search(CJK);
  if(idx > 0) return makePair(s.slice(0, idx), s.slice(idx));
  if(idx === 0) return null;

  const m = s.match(/^(.{1,40}?)\s*(?:—|–|--|:|=|\s{2,}|,|;)\s*(.+)$/);
  if(m) return makePair(m[1], m[2]);
  return null;
}

function makePair(wRaw, mRaw){
  let w = String(wRaw)
    .replace(/[\/\[][^\/\]\n]{0,40}[\/\]]/g, " ")
    .replace(/[\s\-—–:：=,，。;；·]+$/, "")
    .replace(/\s+/g, " ")
    .trim();
  let m = String(mRaw)
    .replace(/^[\s\-—–:：=,，、;；]+/, "")
    .replace(/\s+/g, " ")
    .trim();
  if(!w || !m) return null;
  if(w.length > 40) return null;
  if(!/^[A-Za-z][A-Za-z\s'’\-.]*$/.test(w)) return null;
  if(m.length > 80) m = m.slice(0, 80);
  return {w, m};
}

function parseText(text){
  const out = [];
  const seen = new Set();
  text.replace(/\r\n?/g, "\n").split("\n").forEach(line => {
    const p = parseLine(line);
    if(!p) return;
    const k = p.w.toLowerCase();
    if(seen.has(k)) return;
    seen.add(k);
    out.push(p);
  });
  return out;
}

/* ---- zip 解析（无第三方库） ---- */
function parseZip(u8){
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eocd = -1;
  const floor = Math.max(0, u8.length - 66000);
  for(let i = u8.length - 22; i >= floor; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error("不是有效的 .docx（旧版 .doc 请先另存为 .docx）");
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder("utf-8");
  const map = {};
  for(let k = 0; k < count; k++){
    if(off + 46 > u8.length || dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const compSize = dv.getUint32(off + 20, true);
    const nameLen = dv.getUint16(off + 28, true);
    const extraLen = dv.getUint16(off + 30, true);
    const cmtLen = dv.getUint16(off + 32, true);
    const localOff = dv.getUint32(off + 42, true);
    const name = dec.decode(u8.subarray(off + 46, off + 46 + nameLen));
    map[name] = {method, compSize, localOff};
    off += 46 + nameLen + extraLen + cmtLen;
  }
  return map;
}

async function unzipEntry(u8, e){
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  if(dv.getUint32(e.localOff, true) !== 0x04034b50) throw new Error("压缩包结构异常");
  const nameLen = dv.getUint16(e.localOff + 26, true);
  const extraLen = dv.getUint16(e.localOff + 28, true);
  const start = e.localOff + 30 + nameLen + extraLen;
  const raw = u8.subarray(start, start + e.compSize);
  if(e.method === 0) return raw;
  if(typeof DecompressionStream === "undefined"){
    throw new Error("当前浏览器不支持解压，请用 Chrome/Edge 打开，或改用 txt 导入");
  }
  const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function docxBodyText(xml){
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if(doc.getElementsByTagName("parsererror").length) throw new Error("文档内容解析失败");
  const body = doc.getElementsByTagNameNS(W_NS, "body")[0] || doc.documentElement;
  const lines = [];

  const paraText = p => {
    let s = "";
    (function walk(n){
      for(let i = 0; i < n.childNodes.length; i++){
        const c = n.childNodes[i];
        if(c.nodeType !== 1) continue;
        const tag = c.localName;
        if(tag === "t") s += c.textContent;
        else if(tag === "tab") s += "\t";
        else if(tag === "br" || tag === "cr") s += "\n";
        else if(tag !== "pPr" && tag !== "rPr") walk(c);
      }
    })(p);
    return s;
  };

  const visit = node => {
    for(let i = 0; i < node.children.length; i++){
      const ch = node.children[i];
      const tag = ch.localName;
      if(tag === "p"){
        const t = paraText(ch);
        if(t.trim()) lines.push(t);
      }else if(tag === "tbl"){
        for(let r = 0; r < ch.children.length; r++){
          const tr = ch.children[r];
          if(tr.localName !== "tr") continue;
          const cells = [];
          for(let c = 0; c < tr.children.length; c++){
            const tc = tr.children[c];
            if(tc.localName !== "tc") continue;
            const ps = tc.getElementsByTagNameNS(W_NS, "p");
            const txt = Array.prototype.map.call(ps, paraText).filter(x => x.trim()).join(" ");
            cells.push(txt);
          }
          if(cells.some(x => x.trim())) lines.push(cells.join("\t"));
        }
      }else if(tag !== "sectPr"){
        visit(ch);
      }
    }
  };
  visit(body);
  return lines.join("\n");
}

async function readDocx(file){
  const u8 = new Uint8Array(await file.arrayBuffer());
  const map = parseZip(u8);
  const name = map["word/document.xml"] ? "word/document.xml"
    : Object.keys(map).find(n => /^word\/document\d*\.xml$/.test(n));
  if(!name) throw new Error("这个文件里没有 Word 正文，可能不是 .docx");
  const data = await unzipEntry(u8, map[name]);
  return docxBodyText(new TextDecoder("utf-8").decode(data));
}

async function handleFile(file){
  if(!file) return;
  const nm = file.name.toLowerCase();
  try{
    let text;
    if(nm.endsWith(".docx")){
      text = await readDocx(file);
    }else if(nm.endsWith(".doc")){
      toast("旧版 .doc 无法直接读取，请在 Word 里另存为 .docx");
      return;
    }else{
      text = await file.text();
    }
    const rows = parseText(text);
    if(!rows.length){
      toast("没识别到词条，检查一下格式：每行「单词  释义」");
      return;
    }
    imp = {rows, name: file.name};
    renderPreview();
    toast("已识别 " + rows.length + " 条，可修改后导入");
  }catch(err){
    toast(err.message || "读取失败");
  }
}

function renderPreview(){
  const wrap = $("previewWrap");
  if(!wrap) return;
  if(!imp.rows.length){ wrap.innerHTML = ""; $("impFoot").hidden = true; return; }

  wrap.innerHTML =
    '<div class="pv-head">解析结果 <b>' + imp.rows.length + '</b> 条<span class="pv-tip">' + esc(imp.name) + ' · 可修改或删除</span></div>' +
    '<div class="pv-list" id="pvList"></div>';
  $("impFoot").hidden = false;

  const list = $("pvList");
  imp.rows.forEach((r, i) => {
    const row = document.createElement("div");
    row.className = "pv-row";
    row.innerHTML = '<span class="pv-no">' + (i + 1) + '</span>' +
      '<input class="w" value="' + esc(r.w) + '"><input class="m" value="' + esc(r.m) + '">' +
      '<button class="pv-del" title="删除">✕</button>';
    row.querySelector(".w").addEventListener("input", e => { imp.rows[i].w = e.target.value; updatePreviewCount(); });
    row.querySelector(".m").addEventListener("input", e => { imp.rows[i].m = e.target.value; updatePreviewCount(); });
    row.querySelector(".pv-del").addEventListener("click", () => {
      imp.rows.splice(i, 1);
      renderPreview();
      updatePreviewCount();
    });
    list.appendChild(row);
  });

  $("btnAppend").onclick = () => applyImport("append");
  $("btnReplace").onclick = () => applyImport("replace");
}

function updatePreviewCount(){
  const h = document.querySelector(".pv-head b");
  if(h) h.textContent = imp.rows.filter(r => r.w.trim() && r.m.trim()).length;
}

function applyImport(mode){
  const rows = imp.rows
    .map(r => ({w: r.w.trim(), m: r.m.trim()}))
    .filter(r => r.w && r.m);
  if(!rows.length){ toast("没有可导入的有效词条"); return; }

  if(mode === "replace"){
    if(!confirm("将清空现有 " + st.words.length + " 个词，替换为 " + rows.length + " 个新词，进度会重置。确定吗？")) return;
    st.words = rows.map(r => ({id: uid(), w: r.w, m: r.m}));
    st.cursor = 0; st.wrong = []; st.seen = {}; st.fav = [];
    st.day = {date: "", queue: [], done: [], pending: [], right: 0, wrong: 0, built: false, newCount: 0};
  }else{
    const seen = new Set(st.words.map(x => x.w.toLowerCase()));
    let added = 0;
    rows.forEach(r => {
      const k = r.w.toLowerCase();
      if(seen.has(k)) return;
      seen.add(k);
      st.words.push({id: uid(), w: r.w, m: r.m});
      added++;
    });
    if(!added){ toast("这些词都已经在词库里了"); return; }
    toast("已追加 " + added + " 个词" + (added < rows.length ? "（跳过 " + (rows.length - added) + " 个重复）" : "") +
      (st.day.queue.length ? "，明天起进入队列" : ""));
  }

  // 今日队列为空时才补充新词
  if(!st.day.built || st.day.queue.length === 0){
    st.day.built = false; st.day.queue = [];
  }
  ensureToday();
  save();
  closeOverlay();
  view = "home"; session = null;
  render();
}

      '<div class="field">' +
        '<div><div class="field-label">昨天没背完</div>' +
        '<div class="field-desc">' + (s.rollover ? "明天的队列会先补齐这些词" : "直接跳过，不再补") + '</div></div>' +
        '<div class="seg" id="rollSeg">' +
          '<button class="btn' + (s.rollover ? " on" : "") + '" data-v="1">顺延</button>' +
          '<button class="btn' + (!s.rollover ? " on" : "") + '" data-v="0">跳过</button>' +
        '</div>' +
      '</div>' +
      '<div class="field">' +
        '<div><div class="field-label">选项顺序</div>' +
        '<div class="field-desc">每次答题都重新打乱</div></div>' +
        '<div class="seg" id="shufSeg">' +
          '<button class="btn' + (s.shuffleOpts ? " on" : "") + '" data-v="1">打乱</button>' +
          '<button class="btn' + (!s.shuffleOpts ? " on" : "") + '" data-v="0">固定</button>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="sec-title">数据</div>' +
    '<div class="panel">' +
      '<div class="field">' +
        '<div><div class="field-label">词库</div><div class="field-desc">共 ' + st.words.length + ' 词 · 已学 ' +
          Object.keys(st.seen || {}).filter(byId).length + ' 词 · 错词 ' + st.wrong.filter(byId).length + ' 词</div></div>' +
        '<button class="btn sm" id="btnExport">导出 CSV</button>' +
      '</div>' +
      '<div class="field">' +
        '<div><div class="field-label">重置</div><div class="field-desc">清空进度，从第一个词重新开始</div></div>' +
        '<button class="btn sm" id="btnReset">重置进度</button>' +
      '</div>' +
      '<div class="field">' +
        '<div><div class="field-label">清空词库</div><div class="field-desc">删除全部单词，保留设置</div></div>' +
        '<button class="btn sm" id="btnClear" style="color:var(--red);border-color:#FECACA">清空</button>' +
      '</div>' +
    '</div>' +
    '<div class="hero-note" style="margin-top:16px">进度保存在本机浏览器里，换浏览器或清理缓存会重置。建议用「导出 CSV」备份词库。</div>';

  $("overlay").hidden = false;
  document.body.style.overflow = "hidden";

  $("ovClose").addEventListener("click", () => { closeOverlay(); render(); });

  const setQuota = v => {
    v = Math.max(1, Math.min(200, parseInt(v, 10) || 1));
    st.settings.quota = v;
    save();
    if(st.day.done.length === 0 && st.day.queue.length){ rebuildDay(); }
    $("quotaInput").value = v;
    document.querySelectorAll("#quotaChips .chip").forEach(c => c.classList.toggle("on", +c.dataset.q === v));
    toast("每日 " + v + " 词" + (st.day.done.length ? "，明天生效" : "，今日已更新"));
  };
  $("quotaInput").addEventListener("change", e => setQuota(e.target.value));
  $("quotaChips").addEventListener("click", e => {
    const c = e.target.closest(".chip");
    if(c) setQuota(c.dataset.q);
  });
  $("rollSeg").addEventListener("click", e => {
    const b = e.target.closest("button");
    if(!b) return;
    st.settings.rollover = b.dataset.v === "1";
    save();
    document.querySelectorAll("#rollSeg .btn").forEach(x => x.classList.toggle("on", x === b));
    b.parentElement.previousElementSibling.querySelector(".field-desc").textContent =
      st.settings.rollover ? "明天的队列会先补齐这些词" : "直接跳过，不再补";
  });
  $("shufSeg").addEventListener("click", e => {
    const b = e.target.closest("button");
    if(!b) return;
    st.settings.shuffleOpts = b.dataset.v === "1";
    save();
    document.querySelectorAll("#shufSeg .btn").forEach(x => x.classList.toggle("on", x === b));
  });

  $("btnExport").addEventListener("click", () => {
    const csv = "\ufeff" + st.words.map(x => '"' + x.w.replace(/"/g, '""') + '","' + x.m.replace(/"/g, '""') + '"').join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv;charset=utf-8"}));
    a.download = "词库_" + todayStr() + ".csv";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast("已导出 " + st.words.length + " 词");
  });
  $("btnReset").addEventListener("click", () => {
    if(!confirm("清空学习进度，从第一个词重新开始？（词库不受影响）")) return;
    st.cursor = 0; st.wrong = []; st.seen = {};
    st.day = {date: "", queue: [], done: [], pending: [], right: 0, wrong: 0, built: false, newCount: 0};
    st.hist = {};
    save(); ensureToday(); closeOverlay(); view = "home"; render();
    toast("进度已重置");
  });
  $("btnClear").addEventListener("click", () => {
    if(!confirm("删除全部 " + st.words.length + " 个单词？此操作不可撤销。")) return;
    st.words = []; st.cursor = 0; st.wrong = []; st.seen = {};
    st.day = {date: "", queue: [], done: [], pending: [], right: 0, wrong: 0, built: false, newCount: 0};
    save(); closeOverlay(); view = "home"; render();
    toast("词库已清空");
  });
}

function closeOverlay(){
  $("overlay").hidden = true;
  document.body.style.overflow = "";
}

/* =========================================================
   11. 渲染与事件
   ========================================================= */
function render(){
  if(view === "quiz" && session) renderQuiz();
  else if(view === "spell" && session) renderSpell();
  else if(view === "done" && session) renderDone();
  else renderHome();
}

$("overlay").addEventListener("click", e => {
  if(e.target.id === "overlay") closeOverlay();
});

document.addEventListener("keydown", e => {
  if(!$("overlay").hidden){
    if(e.key === "Escape") closeOverlay();
    return;
  }
  if(view !== "quiz" || !session) return;
  if(["1", "2", "3"].includes(e.key)){
    const i = Number(e.key) - 1;
    const c = session.cache[session.pos];
    if(c && i < c.opts.length) answer(i);
  }
  if(e.key === "Enter" || e.key === " " || e.key === "ArrowRight"){
    e.preventDefault();
    nextCard();
  }
  if(e.key === "ArrowLeft"){ e.preventDefault(); prevCard(); }
});

ensureToday();
render();
window.__appBooted = true;
</script>
